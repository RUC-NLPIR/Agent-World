<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">Agent-World</title>
  <desc id="desc">Scaling real-world environments for evolving general agent intelligence</desc>
  <defs>
